name: tests

on:
  push:
    # Every branch, but no tag: a release tag runs the suite once, through
    # publish.yml's workflow_call, rather than a second time from here.
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run ruff check
      - run: uv run ruff format --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    # The suite takes minutes; a hung job is stopped rather than left to
    # block a release for hours.
    timeout-minutes: 20
    env:
      # uv's own Python builds include Tk, which the GUI tests need;
      # Homebrew's Python on macOS does not.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv run playwright install --with-deps chromium
      # Tk needs a display. The Windows and macOS runners have one; the Linux
      # runners do not, so there the suite runs under a virtual X server.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
        if: runner.os == 'Linux'
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}uv run pytest
