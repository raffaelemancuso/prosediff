[project]
name = "prosediff"
version = "0.3.1"
description = "Side-by-side diff for prose, not code: optimised for Word .docx documents, OpenDocument .odt and Markdown included, from two files or from git"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["diff", "docx", "word", "odt", "libreoffice", "markdown", "prose", "compare", "track changes", "git"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
]
authors = [
    { name = "Raffaele Mancuso", email = "raffaelemancuso532@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "charset-normalizer>=3.5.1",
    "gitpython>=3.1.62",
    "jinja2>=3.1.6",
    "langcodes[data]>=3.5.1",
    "lxml>=6.1.3",
    "markupsafe>=3.0",
    "py3langid>=0.4.0",
    "pyphen>=0.18.1",
    "python-docx>=1.2.0",
    "rapidfuzz>=3.14.6",
    "yasbd-lib>=1.0.0,<2",
]

[project.urls]
Homepage = "https://github.com/raffaelemancuso/prosediff"
Issues = "https://github.com/raffaelemancuso/prosediff/issues"

[project.scripts]
prosediff = "prosediff.cli:main"

# A window, without a console on Windows.
[project.gui-scripts]
prosediff-gui = "prosediff.gui:main"

[project.optional-dependencies]
odt = [
    "odfdo>=3.26.1",
]

[dependency-groups]
dev = [
    "odfdo>=3.26.1",
    "playwright>=1.63.0",
    "pytest>=8.4.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous characters: the page uses − and … on purpose
    "RUF002",
    "RUF003",
]
