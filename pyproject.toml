[project]
name = "sidediff"
version = "0.1.0"
description = "Write a self-contained HTML page showing the diff between two commits of a git repository side by side"
readme = "README.md"
authors = [
    { name = "Raffaele Mancuso", email = "raffaelemancuso532@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "gitpython>=3.1.62",
    "jinja2>=3.1.6",
    "markupsafe>=3.0",
    "python-docx>=1.2.0",
    "rapidfuzz>=3.14.6",
    "yasbd-lib>=1.0.0,<2",
]

[project.scripts]
sidediff = "sidediff.cli:main"

# A window, without a console on Windows.
[project.gui-scripts]
sidediff-gui = "sidediff.gui:main"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8.4.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous characters: the page uses − and … on purpose
    "RUF002",
    "RUF003",
]
