[project]
name = "prosediff"
version = "0.7.0"
description = "Side-by-side diff for prose, not code: compares versions of Word, OpenDocument and Markdown documents, restores their tracked changes, and has an AI assess the edits"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "diff",
    "compare",
    "document comparison",
    "prose",
    "docx",
    "word",
    "odt",
    "libreoffice",
    "markdown",
    "track changes",
    "redline",
    "comments",
    "academic writing",
    "peer review",
    "co-authoring",
    "ai",
    "llm",
    "git",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Text Processing :: General",
    "Topic :: Utilities",
]
authors = [
    { name = "Raffaele Mancuso", email = "raffaelemancuso532@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cchardet>=2.3.0",
    "charset-normalizer>=3.5.1",
    "docx-plus>=0.6.2",
    "gitpython>=3.1.62",
    "humanize>=4.16.0",
    "jinja2>=3.1.6",
    "langcodes[data]>=3.5.1",
    "lxml>=6.1.3",
    "markdown-it-py>=4.2.0",
    "markupsafe>=3.0",
    "odfdo>=3.26.2",
    "patiencediff>=0.2.19",
    "psutil>=7.2.2",
    "py3langid>=0.4.0",
    "pypdfium2>=5.13.0",
    "pyphen>=0.18.1",
    "python-docx>=1.2.0",
    "pywebview>=6.2",
    "pywebview[qt]>=6.2 ; sys_platform == 'linux'",
    "rapidfuzz>=3.14.6",
    "yasbd-lib>=1.0.0,<2",
]

[project.urls]
Homepage = "https://raffaelemancuso.github.io/prosediff/"
Source = "https://github.com/raffaelemancuso/prosediff"
Issues = "https://github.com/raffaelemancuso/prosediff/issues"
Changelog = "https://github.com/raffaelemancuso/prosediff/releases"

[project.scripts]
prosediff = "prosediff.cli:main"

# A window, without a console on Windows.
[project.gui-scripts]
prosediff-gui = "prosediff.gui:main"

[project.optional-dependencies]
claude = [
    "claude-agent-sdk>=0.2.160",
]
codex = [
    "openai-codex>=0.158.0",
]
models = [
    "any-llm-sdk[ollama]>=1.29.0",
]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# A test over 120 s fails with every thread's stack printed (pytest-timeout).
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous characters: the page uses − and … on purpose
    "RUF002",
    "RUF003",
]
